version: '3.8'

services:
  bank-front-app:
    container_name: bank-front_c
    build:
      context: .
      dockerfile: bank-front-app/Dockerfile
    restart: always
    ports:
      - "8081:8080"
    networks:
      - app-network

  accounts:
    container_name: accounts_c
    build:
      context: .
      dockerfile: accounts/Dockerfile
    restart: always
#    ports:
#      - "8081:8080"
    networks:
      - app-network

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    container_name: keycloak_c
    command:
      - start-dev
      - --http-port=8080
      - --import-realm
    volumes:
      - ./keycloak-config:/opt/keycloak/data/import
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME: localhost
    ports:
      - "8080:8080"

networks:
  app-network:
    driver: bridge