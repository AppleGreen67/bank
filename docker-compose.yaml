version: '3.8'

services:
#  bank-front-app:
#    container_name: bank-front_c
#    build:
#      context: .
#      dockerfile: bank-front-app/Dockerfile
#    restart: always
#    ports:
#      - "8084:8080"
#    networks:
#      - app-network

  accounts:
    container_name: accounts_c
    build:
      context: .
      dockerfile: accounts/Dockerfile
    restart: always
    ports:
      - "8082:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mydb
      SPRING_DATASOURCE_USERNAME: myuser
      SPRING_DATASOURCE_PASSWORD: mypassword
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

  gateway:
    container_name: gateway_c
    build:
      context: .
      dockerfile: gateway/Dockerfile
    restart: always
    ports:
      - "8081:8080"
    networks:
      - app-network

  postgres:
    image: postgres:15-alpine
    container_name: myapp-postgres
    environment:
      POSTGRES_DB: mydb
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
#      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d mydb"]
      interval: 10s
      timeout: 5s
      retries: 5


  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    container_name: keycloak_c
    command:
      - start-dev
      - --http-port=8080
      - --import-realm
      - --verbose
    volumes:
      - ./keycloak-config:/opt/keycloak/data/import
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
#      KC_HOSTNAME: localhost
    ports:
      - "8080:8080"
    networks:
      - app-network

volumes:
  postgres-data:

networks:
  app-network:
    driver: bridge