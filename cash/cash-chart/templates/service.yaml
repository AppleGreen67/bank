apiVersion: v1
kind: Service
metadata:
  name: {{ include "cash.fullname" . }}
  labels:
    app: {{ .Chart.Name }}
    {{- include "cash.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "cash.selectorLabels" . | nindent 4 }}
