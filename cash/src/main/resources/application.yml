server:
  port: 8085

logging:
  level:
    root: INFO
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: DEBUG
    org.springframework.security.oauth2.jwt: DEBUG
    org.springframework.security.authentication: DEBUG
    org.springframework.security.oauth2.client: DEBUG

bank:
  accounts:
    base-url: ${ACCOUNTS_URL}
    timeout: 4

topic:
  notification:
    name: ${TOPIC_NOTIFICATION_NAME}

spring:
  application:
    name: cash

  kafka:
    bootstrap-servers: ${KAFKA_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_EXTERNAL_URL}/realms/bank-realm
          jwk-set-uri: ${KEYCLOAK_INTERNAL_URL}/realms/bank-realm/protocol/openid-connect/certs

      client:
        registration:
          transfer-service:
            provider: keycloak
            client-id: transfer-service
            client-secret: ${KEYCLOAK_SECRET}
            authorization-grant-type: client_credentials
#            scope: openid
        provider:
          keycloak:
            token-uri: ${KEYCLOAK_INTERNAL_URL}/realms/bank-realm/protocol/openid-connect/token

resilience4j:
  circuitbreaker:
    instances:
      accountService:
        # Порог срабатывания (процент неудачных вызовов)
        failure-rate-threshold: 50
        # Минимальное количество вызовов перед срабатыванием
        minimum-number-of-calls: 10
        # Длительность окна для подсчета вызовов
        sliding-window-size: 10
        # Тип окна (COUNT_BASED или TIME_BASED)
        sliding-window-type: COUNT_BASED
        # Время ожидания перед переходом из OPEN в HALF_OPEN
        wait-duration-in-open-state: 10s
        # Количество разрешенных вызовов в HALF_OPEN состоянии
        permitted-number-of-calls-in-half-open-state: 5
        # Таймаут для вызовов
        slow-call-duration-threshold: 4s
        # Порог медленных вызовов
        slow-call-rate-threshold: 50
        # Автоматический переход из HALF_OPEN в OPEN при определенном проценте неудач
        automatic-transition-from-open-to-half-open-enabled: true

  timelimiter:
    instances:
      accountService:
        timeout-duration: 5s

  retry:
    instances:
      secondApp:
        max-attempts: 3
        wait-duration: 1s
        retry-exceptions:
          - org.springframework.web.reactive.function.client.WebClientResponseException$ServiceUnavailable
          - java.util.concurrent.TimeoutException
        ignore-exceptions:
          - java.lang.IllegalArgumentException

management:
  zipkin:
    tracing:
      endpoint: http://bank-zipkin:9411/api/v2/spans
  tracing:
    sampling:
      probability: 1
  endpoints:
    web:
      exposure:
        include: '*'