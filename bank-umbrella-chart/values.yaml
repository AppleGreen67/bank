global:
  kc_secret: <secret>

zipkin:
  enabled: true
  service:
    type: ClusterIP
    port: 9411
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
  ingress:
    enabled: true
    host: zipkin.local
    className: "traefik"
    annotations:
      kubernetes.io/ingress.class: "traefik"

kube-prometheus-stack:
  alertmanager:
    enabled: true

  grafana:
    defaultDashboardsEnabled: false
    adminPassword: admin

    service:
      type: NodePort
      nodePort: 30000

    persistence:
      enabled: true
      size: 1Gi

    sidecar:
      dashboards:
        enabled: true
        label: grafana_dashboard
        labelValue: "1"

  prometheus:
    prometheusSpec:
      retention: 10d
      storageSpec:
        volumeClaimTemplate:
          spec:
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 20Gi

logstash:
  enabled: true
  replicas: 1

  logstashConfig:
    logstash.yml: |
      http.host: "0.0.0.0"
      xpack.monitoring.enabled: false
      config.reload.automatic: true
      config.reload.interval: "10s"

  logstashPipeline:
    logstash.conf: |
      input { tcp { port => 5044 codec => json_lines } }
      output {
        elasticsearch {
          hosts => ["http://elasticsearch-master:9200"]
          index => "logs-%{+YYYY.MM.dd}"
        }
      }

  podAnnotations:
    app: logstash
  resources:
    requests:
      memory: "512Mi"
      cpu: "200m"
    limits:
      memory: "1Gi"
      cpu: "500m"
  service:
    ports:
      - name: tcp
        port: 5044
        protocol: TCP
        targetPort: 5044

elasticsearch:
  enabled: true
  replicas: 1
  antiAffinity: "soft"
  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "1000m"
  volumeClaimTemplate:
    accessModes: ["ReadWriteOnce"]
    resources:
      requests:
        storage: 10Gi
  esJavaOpts: "-Xmx512m -Xms512m"

kibana:
  enabled: true
  replicas: 1
  elasticsearchHosts: "http://elasticsearch-master:9200"
  resources:
    requests:
      memory: "512Mi"
      cpu: "200m"
    limits:
      memory: "1Gi"
      cpu: "500m"
  service:
    type: ClusterIP
    port: 5601
  ingress:
    enabled: true
    className: "traefik"
    annotations:
      kubernetes.io/ingress.class: "traefik"
    hosts:
      - host: kibana.local
        paths:
          - path: /
            pathType: Prefix