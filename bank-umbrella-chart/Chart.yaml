apiVersion: v2
name: bank-umbrella-chart
description: A Helm chart for Kubernetes

#type: application

version: 0.1.0

#appVersion: "1.16.0"
dependencies:
  - name: bank-front-app
    version: "0.1.0"
    repository: "file://../bank-front-app/bank-front-app-chart"
  - name: accounts
    version: "0.1.0"
    repository: "file://../accounts/accounts-chart"
  - name: notification
    version: "0.1.0"
    repository: "file://../notification/notification-chart"
  - name: cash
    version: "0.1.0"
    repository: "file://../cash/cash-chart"
  - name: transfer
    version: "0.1.0"
    repository: "file://../transfer/transfer-chart"
  - name: gateway
    version: "0.1.0"
    repository: "file://../gateway/gateway-chart"
  - name: zipkin
    version: "0.4.0"
    repository: "https://zipkin.io/zipkin-helm"
    condition: zipkin.enabled
  - name: kube-prometheus-stack
    version: "65.1.1"
    repository: "https://prometheus-community.github.io/helm-charts"
  - name: logstash
    version: "7.17.3"
    repository: "https://helm.elastic.co"
    condition: logstash.enabled
