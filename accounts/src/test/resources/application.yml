server:
  port: 8082

bank:
  notification:
    base-url: http://notification-sd
    timeout: 4

stubrunner:
  fail-on-no-stubs: false

topic:
  notification:
    name: "log-events"

spring:
  application:
    name: accounts

  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: yandex-practicum-test
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer

  config:
    import: ""

  cloud:
    contract:
      stubrunner:
        fail-on-no-stubs: false
    consul:
      enabled: false
      config:
        enabled: false
      discovery:
        enabled: false

#  datasource:
#    url: jdbc:h2:mem:usersdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
#    driver-class-name: org.h2.Driver
#    username: test
#    password: test

  liquibase:
    enabled: false

  jpa:
    show-sql: true

#  sql:
#    init:
#      mode: always
#      data-locations: classpath:sql/data.sql

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/bank-realm
          jwk-set-uri: http://keycloak:8080/realms/bank-realm/protocol/openid-connect/certs

      client:
        registration:
          transfer-service:
            provider: keycloak
            client-id: transfer-service
            client-secret: ${KEYCLOAK_SECRET}
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            token-uri: http://keycloak:8080/realms/bank-realm/protocol/openid-connect/token
