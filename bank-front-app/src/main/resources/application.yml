server:
  port: 8084

bank:
  gateway:
    base-url: ${GATEWAY_URL}
#    base-url: http://gateway:8081
#  accounts:
#    base-url: ${ACCOUNTS_URL}
#  cash:
#    base-url: ${CASH_URL}
#  transfer:
#    base-url: ${TRANSFER_URL}

spring:
  application:
    name: bank-front-app

  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: bank-ui
#            client-secret: ui-client-secret
            authorization-grant-type: authorization_code
            scope: openid, profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            provider: keycloak
        provider:
          keycloak:
#            authorization-uri: http://localhost:8080/realms/bank-realm/protocol/openid-connect/auth
#            token-uri: http://keycloak:8080/realms/bank-realm/protocol/openid-connect/token
#            jwk-set-uri: http://keycloak:8080/realms/bank-realm/protocol/openid-connect/certs
            authorization-uri: ${KC_AUTH_URI}/realms/bank-realm/protocol/openid-connect/auth
            token-uri: ${KC_TOKEN_URI}/realms/bank-realm/protocol/openid-connect/token
            jwk-set-uri: ${KC_JWK_URI}/realms/bank-realm/protocol/openid-connect/certs

management:
  zipkin:
    tracing:
      endpoint: http://bank-zipkin:9411/api/v2/spans
  tracing:
    sampling:
      probability: 1
  endpoints:
    web:
      exposure:
        include: '*'