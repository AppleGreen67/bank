{{- if .Values.test.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "bank-front-app.fullname" . }}-test-connection"
  labels:
    {{- include "bank-front-app.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['bank-bank-front-app/actuator/health']
  restartPolicy: Never
{{- end }}