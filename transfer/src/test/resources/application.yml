bank:
  accounts:
    base-url: http://accounts:8082
  notification:
    base-url: http://notification:8087

spring:
  main:
    allow-bean-definition-overriding: true

  application:
    name: transfer

  config:
    import: ""

  cloud:
    loadbalancer:
      enabled: false
    consul:
      enabled: false
      config:
        enabled: false
      discovery:
        enabled: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/bank-realm
          jwk-set-uri: http://localhost:8080/realms/bank-realm/protocol/openid-connect/certs

      client:
        registration:
          transfer-service:
            provider: keycloak
            client-id: transfer-service
            client-secret: ZY4fuQa2weoz2SV60g6kberJPoMX9rxd
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            token-uri: http://localhost:8080/realms/bank-realm/protocol/openid-connect/token
