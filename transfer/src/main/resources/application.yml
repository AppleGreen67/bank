server:
  port: 8086

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: DEBUG
    org.springframework.security.oauth2.jwt: DEBUG
    org.springframework.security.authentication: DEBUG
    org.springframework.security.oauth2.client: DEBUG

bank:
  accounts:
    base-url: ${ACCOUNTS_URL}
    timeout: 4
  notification:
    base-url: ${NOTIFICATION_URL}
    timeout: 4

spring:
  application:
    name: transfer

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_EXTERNAL_URL}/realms/bank-realm
          jwk-set-uri: ${KEYCLOAK_INTERNAL_URL}/realms/bank-realm/protocol/openid-connect/certs

      client:
        registration:
          transfer-service:
            provider: keycloak
            client-id: transfer-service
            client-secret:  ${KEYCLOAK_SECRET}
            authorization-grant-type: client_credentials
            scope: openid
        provider:
          keycloak:
            token-uri: ${KEYCLOAK_INTERNAL_URL}/realms/bank-realm/protocol/openid-connect/token

resilience4j:
  circuitbreaker:
    instances:
      accountService:
        failure-rate-threshold: 50
        minimum-number-of-calls: 10
        sliding-window-size: 10
        sliding-window-type: COUNT_BASED
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 5
        slow-call-duration-threshold: 4s
        slow-call-rate-threshold: 50
        automatic-transition-from-open-to-half-open-enabled: true
      notificationService:
        failure-rate-threshold: 50
        minimum-number-of-calls: 10
        sliding-window-size: 10
        sliding-window-type: COUNT_BASED
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 5
        slow-call-duration-threshold: 4s
        slow-call-rate-threshold: 50
        automatic-transition-from-open-to-half-open-enabled: true

  timelimiter:
    instances:
      accountService:
        timeout-duration: 5s
      notificationService:
        timeout-duration: 5s

  retry:
    instances:
      secondApp:
        max-attempts: 3
        wait-duration: 1s
        retry-exceptions:
          - org.springframework.web.reactive.function.client.WebClientResponseException$ServiceUnavailable
          - java.util.concurrent.TimeoutException
        ignore-exceptions:
          - java.lang.IllegalArgumentException