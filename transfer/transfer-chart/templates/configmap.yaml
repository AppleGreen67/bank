apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "transfer.fullname" . }}-config
data:
  KEYCLOAK_EXTERNAL_URL: {{ .Values.keycloak.external_url | quote }}
  KEYCLOAK_INTERNAL_URL: {{ .Values.keycloak.internal_url | quote }}
  ACCOUNTS_URL: {{ .Values.accounts_url | quote }}
  KAFKA_SERVERS: {{ .Values.kafka.servers | quote }}
  TOPIC_NOTIFICATION_NAME: {{ .Values.kafka.topic.notification.name | quote }}