server:
  port: 8081

spring:
  application:
    name: gateway

  security:
    oauth2:
      resourceserver:
        jwt:
          # Адрес issuer (Keycloak realm). Gateway по нему получает ключи
          # и параметры токена, чтобы валидировать JWT от UI
          issuer-uri: http://localhost:8080/realms/bank-realm

  cloud:
    gateway:
      server:
        webflux:
          routes:
            # Имя маршрута (используется в логах и конфигурации)
            - id: accounts-service
              # Куда Gateway проксирует запросы, подходящие под предикаты
              # Здесь это accounts-service
              uri: http://localhost:8082
              predicates:
                # Все запросы с путём /accounts/** попадут на этот маршрут
                - Path=/accounts/**
              filters:
                # Подключаем кастомный фильтр Token Relay
                # Он берёт JWT и добавляет заголовок Authorization к исходящему запросу
                - name: JwtTokenRelay

management:
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  level:
    root: INFO
    ru.practicum.bank.gateway: DEBUG
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: DEBUG
