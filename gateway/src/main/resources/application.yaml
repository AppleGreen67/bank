server:
  port: 8081

spring:
  application:
    name: gateway

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/bank-realm
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: accounts-service
              uri: http://localhost:8082
              predicates:
                - Path=/account/**, /accounts/**
              filters:
                - name: JwtTokenRelay
            - id: cash-service
              uri: http://localhost:8085
              predicates:
                - Path=/cash/**
              filters:
                - name: JwtTokenRelay

management:
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  level:
    root: INFO
    ru.practicum.bank.gateway: DEBUG
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: DEBUG
