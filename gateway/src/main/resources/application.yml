server:
  port: 8081

spring:
  application:
    name: gateway

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_EXTERNAL_URL}/realms/bank-realm
          jwk-set-uri: ${KEYCLOAK_INTERNAL_URL}/realms/bank-realm/protocol/openid-connect/certs
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: accounts-service
#              uri: http://accounts:8082
              uri: ${ACCOUNTS_URL}
              predicates:
                - Path=/account/**, /accounts/**
              filters:
                - name: JwtTokenRelay
            - id: cash-service
              uri: ${CASH_URL}
#              uri: http://cash:8085
              predicates:
                - Path=/cash/**
              filters:
                - name: JwtTokenRelay
            - id: transfer-service
              uri: ${TRANSFER_URL}
#              uri: http://transfer:8086
              predicates:
                - Path=/transfer/**
              filters:
                - name: JwtTokenRelay

management:
  zipkin:
    tracing:
      endpoint: http://bank-zipkin:9411/api/v2/spans
  tracing:
    sampling:
      probability: 1
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  level:
    root: DEBUG
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: DEBUG
    org.springframework.security.oauth2.jwt: DEBUG
    org.springframework.security.authentication: DEBUG
    org.springframework.security.oauth2.client: DEBUG
